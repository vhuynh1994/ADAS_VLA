# Round 5 profile: Qwen2.5-VL-7B-Instruct (Apache-2.0) as the base VLM. It is the Qwen2.5-VL size Qualcomm AI Hub ships
# optimized (`qwen2_5_vl_7b_instruct`, Genie w4a16; SA8650P / SA8775P / SA8255P ADP listed), and it shares the
# architecture of the 3B: dataset, prompts, encode_messages, LoRA targets, the 2-frame input and the first-token
# action policy are unchanged. Only the fine-tune has to be redone (scripts/pipeline_v5_7b.sh).
#   adas-vla train --config configs/vlm_7b.yaml ...
#   adas-vla eval  --config configs/vlm_7b.yaml --set vlm.model_id=models/adas-vlm-v5 ...   (after `adas-vla merge`)
vlm:
  model_id: Qwen/Qwen2.5-VL-7B-Instruct   # models/Qwen--Qwen2.5-VL-7B-Instruct after scripts/fetch_hf.py
  quantization: 4bit          # LM ~3.8 GB in nf4; bf16 would not fit the 8 GB card
  quantize_vision: false      # bf16 vision tower (~1.3 GB), the v3 setting. If training runs out of memory set it to
                              # true for BOTH training and evaluation (the ViT outputs must match what was trained on).
  image_size: [560, 308]
  max_new_tokens: 64
