# Default configuration: deployment-aligned with Snapdragon Ride Elite (SA8797P) and runnable on an
# RTX 4060 Laptop GPU (8 GB VRAM). See docs/DEPLOY_SA8797P.md for the rationale behind the model choice.
# Any value can be overridden from the CLI: --set vlm.language=vi --set control.cruise_speed_kmh=80

ego_speed_kmh: 60.0          # assumed ego speed when no CAN bus is available (video files)

camera:
  hfov_deg: 60.0             # horizontal FOV of the dashcam; drives monocular distance estimates
  mount_height_m: 1.3

perception:
  detector_model: yolo11s.pt # auto-downloaded by ultralytics; yolo11n.pt is faster, less accurate
  device: cuda:0
  conf: 0.35
  imgsz: 640
  track: true                # ByteTrack IDs -> closing speed -> time-to-collision
  classes: [person, bicycle, car, motorcycle, bus, truck, traffic light, stop sign]
  lane_detection: true
  lane_model: yolop          # yolop (CNN lane segmentation, ~7 ms on GPU) | classic (Canny + Hough)
  lane_weights: models/yolop/yolop-640-640.onnx
  cut_in_rate: 0.25          # adjacent vehicle closing the gap to our corridor faster than this (corridor widths/s)
  cut_in_max_distance_m: 30.0  # ... and nearer than this is reported as CUTTING IN (and treated as the lead)
  cut_in_max_pull_away_mps: 1.0  # ... unless it is pulling away from us faster than this (overtaking, not a threat)
  velocity_window_s: 0.5      # closing speed = distance slope over this window (TTC noise vs lag)

vlm:
  enabled: true
  # Image features are merged only at the input embeddings, so it splits cleanly into ViT + LM for NPU export.
  # LICENSE: Qwen Research (non-commercial) -> R&D only; ship 7B (Apache-2.0) or get a commercial license.
  model_id: models/adas-vlm-v3   # fine-tuned (round 3); base: Qwen/Qwen2.5-VL-3B-Instruct
  adapter_path: null         # LoRA adapter from `adas-vla train`
  quantization: 4bit         # none | 4bit | 8bit  (3B in bf16 does not fit 8 GB next to YOLO)
  quantize_vision: false     # vision encoder stays bf16: faster (no slow bnb kernel) and more accurate
  dtype: bfloat16
  device_map: cuda:0
  image_size: [560, 308]     # static VLM input (20x11 = 220 visual tokens); null = dynamic
  image_max_side: 640        # only used when image_size is null
  max_new_tokens: 64         # decision JSON is ~35 tokens; chat uses its own limit
  generate_reason: false     # true: VLM also writes a short reason (HUD/demo), ~0.4 s slower
  prev_frame_s: 0.0          # 0.5: also feed the frame 0.5 s earlier as a 2-frame video (same 220 tokens on
                             # Qwen2.5-VL); only with a model fine-tuned with the same setting (v4+). v3 = 0.
  action_policy: greedy      # greedy | cautious | cautious_gated (cautious only when perception shows a hazard)
  temperature: 0.0
  language: en               # en | vi
  mode: sync                 # sync (offline video, deterministic) | async (live camera)
  trigger: event             # interval | event (also call on new lead / VRU in path / light / lanes lost)
  every_n_frames: 15
  min_interval_frames: 5
  max_decision_age_s: 2.0

llm:                         # text-only explainer: `adas-vla explain --log run.jsonl`
  model_id: Qwen/Qwen3-4B-Instruct-2507   # Apache-2.0; ~2.5 GB in 4-bit
  quantization: 4bit
  dtype: bfloat16
  device_map: cuda:0
  max_new_tokens: 160
  temperature: 0.0
  language: vi

safety:
  aeb_ttc_s: 1.5
  fcw_ttc_s: 2.7
  min_distance_m: 4.0
  min_time_gap_s: 0.8
  vru_brake_distance_m: 15.0
  ldw_offset: 0.6
  allow_lane_change: false
  max_speed_kmh: 130.0
  aeb_hold_s: 0.5            # AEB / FCW stay active this long after their last trigger (no single-frame flapping)
  fcw_hold_s: 1.0
  hysteresis: 1.3            # ... and release only once TTC / distance / headway exceed the trigger x 1.3
  aeb_confirm_s: 0.1         # AEB acts once triggered this long: filters one-off monocular phantoms (FCW acts at once)
  aeb_confirm_gap_s: 0.1     # ... counting through dropouts up to this long (a close cut-in is often missed for frames)

control:
  cruise_speed_kmh: 60.0
  time_gap_s: 1.8
  standstill_gap_m: 5.0
  kp_speed: 0.08
  kp_steer: 0.5
  nudge_bias: 0.1
  lane_change_bias: 0.25
